---
layout: archive

title: Archive
---

<div class="posts">
  <p>
    A collection of writing from earlier in my career. Preserved for historical context.
  </p>

  {% for post in site.posts %}
  <div class="post">
    <h1 class="post-title">
      <a href="{{ post.url }}">
        {{ post.title }}
      </a>

      <span class="date">
        {{ post.date | date: '%F' }}
      </span>
    </h1>
  </div>
  {% endfor %}
</div>
