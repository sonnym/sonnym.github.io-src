<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3N6CESJ0B5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3N6CESJ0B5');
    </script>

    <link href="http://gmpg.org/xfn/11" rel="profile">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
      {{ site.title }}
      {% if page.title %} - {{ page.title }} {% endif %}
    </title>

    {% if page.description %}
      <meta name="description" content="{{ page.description }}">
    {% endif %}

    <link rel="stylesheet" href="/assets/css/styles.css">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue&display=swap" rel="stylesheet">

    <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">

    <link rel="canonical" href="{{site.url}}{% if page.url != '/index.html' %}{{ page.url }}{% endif %}">
  </head>

  <body>
    <!-- NAV -->
    <nav id="nav" role="navigation" aria-label="Main navigation">
      <div class="nav-inner">
        <a href="/#" class="nav-name">Sonny Michaud</a>
        <ul class="nav-links" role="list">
          <li><a href="/#experience">Experience</a></li>
          <li><a href="/#education">Education</a></li>
          <li><a href="/#contact">Contact</a></li>
          <li><a href="/archive">Archive</a></li>
        </ul>
        <a href="mailto:michaud.sonny@gmail.com" class="nav-cta">Get in touch</a>
        <button class="nav-hamburger" id="nav-hamburger"
          aria-controls="mobile-menu" aria-expanded="false"
          aria-label="Open navigation menu">
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
      </div>
      <div class="mobile-menu" id="mobile-menu" role="dialog"
        aria-label="Navigation menu" aria-modal="false">
        <ul class="mobile-links" role="list">
          <li><a href="/#contact" class="mobile-link">Contact</a></li>
          <li><a href="/#experience" class="mobile-link">Experience</a></li>
          <li><a href="/#education" class="mobile-link">Education</a></li>
          <li><a href="/archive/" class="mobile-link">Archive</a></li>
        </ul>
        <a href="mailto:michaud.sonny@gmail.com" class="mobile-cta">Get in touch</a>
      </div>
    </nav>

    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>

    <main>
      {{ content }}
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-inner">
        <span>&copy; 2026 Sonny Michaud &nbsp;&middot;&nbsp; Austin, TX</span>
        <div class="footer-links">
          <a href="https://linkedin.com/in/sonnymichaud" target="_blank" rel="noopener">LinkedIn</a>
          <a href="https://github.com/sonnym" target="_blank" rel="noopener">GitHub</a>
          <a href="mailto:michaud.sonny@gmail.com">Email</a>
        </div>
      </div>
    </footer>

    <script>
      const nav = document.getElementById('nav');
      window.addEventListener('scroll', () => {
        nav.classList.toggle('scrolled', window.scrollY > 20);
      }, { passive: true });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

      (function () {
        const hamburger = document.getElementById('nav-hamburger');
        const menu      = document.getElementById('mobile-menu');
        const backdrop  = document.getElementById('nav-backdrop');
        if (!hamburger || !menu || !backdrop) return;

        const focusableSelectors = 'a[href], button:not([disabled])';

        function openMenu() {
          menu.classList.add('is-open');
          hamburger.setAttribute('aria-expanded', 'true');
          hamburger.setAttribute('aria-label', 'Close navigation menu');
          backdrop.classList.add('visible');
          const first = menu.querySelector(focusableSelectors);
          if (first) first.focus();
          document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
          hamburger.setAttribute('aria-expanded', 'false');
          hamburger.setAttribute('aria-label', 'Open navigation menu');
          backdrop.classList.remove('visible');
          menu.classList.remove('is-open');
          document.body.style.overflow = '';
          hamburger.focus();
        }

        hamburger.addEventListener('click', () => {
          hamburger.getAttribute('aria-expanded') === 'true' ? closeMenu() : openMenu();
        });

        backdrop.addEventListener('click', closeMenu);

        menu.querySelectorAll('.mobile-link, .mobile-cta').forEach(link => {
          link.addEventListener('click', closeMenu);
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && hamburger.getAttribute('aria-expanded') === 'true') closeMenu();
        });

        menu.addEventListener('keydown', e => {
          if (e.key !== 'Tab') return;
          const focusable = Array.from(menu.querySelectorAll(focusableSelectors));
          const first = focusable[0], last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        });
      }());
    </script>
  </body>
</html>
